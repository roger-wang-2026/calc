<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星光算术岛 · 快乐练习，勇敢闯关</title>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="wrap">
<header class="site-header"><h1>星光算术岛</h1><p>快乐练习，勇敢闯关，每一步都闪闪发光</p></header>
<div class="mode-switch" role="group" aria-label="选择练习模式">
 <button id="practice-mode" class="pri" aria-pressed="true"><span class="mode-icon" aria-hidden="true">✏️</span><span>自由练习</span></button>
 <button id="adventure-mode" aria-pressed="false"><span class="mode-icon" aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:22px;line-height:1;flex-shrink:0">🦊</span><span>计算冒险</span></button>
</div>
<section class="ctl" aria-label="出题设置">
 <div class="row">
  <label>年级 <select id="g"></select></label>
  <label>学期 <select id="t"><option value="1">上册</option><option value="2">下册</option></select></label>
  <label class="practice-option">题量 <select id="n"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></label>
  <label class="practice-option">重复题 <select id="repeat"><option value="no">不重复</option><option value="yes">允许重复</option></select></label>
  <label class="practice-option">留白 <select id="sp"><option value="s0">紧凑</option><option value="s1" selected>适中（打草稿）</option><option value="s2">宽松（列竖式）</option></select></label>
  <label class="practice-option">每行 <select id="cols"><option value="2">2 题</option><option value="3">3 题</option></select></label>
 </div>
 <div id="unit-settings"><div class="hint">一至六年级。按教材单元选择出题范围（默认全选，对应当前学习进度）：</div><div id="u"></div></div>
 <div class="row">
  <button class="pri" id="go">生成题目</button>
  <button id="chk">检查答案</button>
  <button id="pr">打印 / 导出 PDF</button>
  <label class="practice-option"><input type="checkbox" id="pa"> 附答案页</label>
  <button id="th" aria-label="切换明暗主题">明暗</button>
 </div>
 <div class="hint">手机、平板可直接在页面里作答并检查；点“打印 / 导出 PDF”后，在打印窗口选择“另存为 PDF”即可导出 A4 练习卷。</div>
</section>
<section id="adventure" class="adventure" aria-label="计算冒险地图" hidden>
 <div class="adventure-heading"><span class="adventure-mascot" aria-hidden="true">🦊</span><div><p class="eyebrow">小狐狸的星光探险</p><h2>每一步，都有新发现</h2><p>不计时，不扣勋章。慢慢想，勇敢试！</p></div></div>
 <p id="adventure-progress" role="status"></p>
 <div class="trail-track"><div id="trail-fill"></div></div>
 <div id="level-map" class="level-map"></div>
 <div class="badge-heading"><h3>🎖️ 我的勋章收藏</h3><span>通关收集勋章，全对点亮三星</span></div>
 <div id="badge-shelf" class="badge-shelf"></div>
 <div class="certificate-invite"><div><strong>📜 把你的勇敢，装进证书里</strong><p id="certificate-hint">通关任意一关，即可领取专属成果证书。</p></div><button id="certificate-open" class="pri" aria-expanded="false" aria-controls="certificate-panel" disabled>领取成果证书</button></div>
 <section id="certificate-panel" class="certificate-panel" aria-label="冒险成果证书" hidden>
  <div class="row"><label for="certificate-name">小勇者姓名 <input id="certificate-name" maxlength="16" placeholder="填写姓名或昵称" autocomplete="off"></label><button id="certificate-close">收起证书</button></div>
  <p class="hint">姓名仅用于生成证书，不会上传。下载图片后可保存、分享或打印。</p>
  <img id="certificate-preview" alt="计算冒险成果证书预览">
  <div class="row certificate-actions"><button id="certificate-download" class="pri">⬇ 下载高清证书 PNG</button><button id="certificate-svg">下载可缩放版 SVG</button></div>
  <p id="certificate-status" role="status" aria-live="polite"></p>
 </section>
 <p id="save-note" class="hint"></p>
</section>
<section id="mission" class="mission" aria-live="polite" hidden></section>
<p id="status" class="hint" role="status"></p>
<section id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></section>
<div id="effects" class="effects" aria-hidden="true"></div>
<main id="sheet" aria-live="polite"></main>
</div>
<script src="js/generators.js"></script>
<script src="js/practice.js"></script>
<script src="js/feedback.js"></script>
<script src="js/adventure.js"></script>
<script src="js/certificate.js"></script>
<script src="js/app.js"></script>
</body></html>
